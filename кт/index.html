<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Подготовка к КТ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #000; color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; overflow-x: hidden;
  }

  /* --- HEADER --- */
  header {
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky; top: 0; z-index: 100;
  }
  .header-inner { display: flex; align-items: center; gap: 8px; max-width: 800px; margin: 0 auto; }

  .subject-title {
    font-size: 13px; font-weight: 700; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex-shrink: 1; min-width: 0; display: flex; align-items: center; gap: 5px;
  }
  .subject-title .dot { width: 8px; height: 8px; border-radius: 50%; background: #1a56db; flex-shrink: 0; }
  .subject-title.econ .dot { background: #0f9d58; }

  .tabs {
    display: flex; gap: 2px; background: rgba(255,255,255,0.08);
    border-radius: 10px; padding: 2px; flex: 1; min-width: 0; margin-left: auto;
  }
  .tab {
    flex: 1; padding: 6px 8px; border-radius: 8px; border: none;
    background: transparent; color: #999; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: .18s; white-space: nowrap; line-height: 1; text-align: center;
  }
  .tab.active { background: #1a56db; color: #fff; }
  .tab.econ.active { background: #0f9d58; }

  .menu-btn {
    width: 34px; height: 34px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05);
    color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: .18s; font-size: 18px; line-height: 1; padding-bottom: 6px;
  }
  .menu-btn:hover { background: rgba(255,255,255,0.12); }
  .menu-btn:active { transform: scale(0.95); }

  .menu-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 200; display: none; opacity: 0; transition: opacity .2s;
  }
  .menu-overlay.open { display: block; opacity: 1; }

  .dropdown {
    position: fixed; top: 54px; right: 12px; background: #1a1a1a;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 6px;
    min-width: 200px; z-index: 201; display: none;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    transform-origin: top right; animation: dropIn .15s ease;
  }
  .dropdown.open { display: block; }
  @keyframes dropIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  .dropdown-label {
    font-size: 10px; font-weight: 700; color: #666; text-transform: uppercase;
    letter-spacing: 0.5px; padding: 6px 10px 4px;
  }
  .dropdown-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
    color: #ccc; transition: .15s; border: none; background: transparent;
    width: 100%; text-align: left;
  }
  .dropdown-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .dropdown-item.active { background: rgba(26,86,219,0.25); color: #fff; }
  .dropdown-item.active.econ { background: rgba(15,157,88,0.25); }
  .dropdown-item .emoji { font-size: 16px; }
  .dropdown-item .check { margin-left: auto; color: #4db8ff; font-size: 14px; opacity: 0; }
  .dropdown-item.active .check { opacity: 1; }
  .dropdown-item.active.econ .check { color: #4ade80; }

  .screen { display: none; flex: 1; padding: 14px; max-width: 800px; margin: 0 auto; width: 100%; }
  .screen.active { display: block; }

  /* --- УЧЁБА --- */
  .ruler-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .ruler-btn {
    padding: 7px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
    background: #111; color: #aaa; cursor: pointer; font-size: 12px;
    font-weight: 600; transition: .2s; text-align: left;
  }
  .ruler-btn:hover { background: #222; }
  .ruler-btn.active { background: #1a56db; color: #fff; border-color: #1a56db; }
  .ruler-btn.econ.active { background: #0f9d58; border-color: #0f9d58; }
  .ruler-btn.empty { opacity: .5; }
  .ruler-btn .count { font-size: 10px; opacity: .7; font-weight: 400; display: block; margin-top: 1px; }

  .study-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .study-header h2 { font-size: 17px; color: #fff; font-weight: 700; }
  .hide-btn {
    padding: 7px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
    background: #111; color: #fff; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .hide-btn.on { background: #e94560; border-color: #e94560; }

  .point {
    background: #111; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .point .q { font-weight: 700; font-size: 14px; margin-bottom: 7px; color: #4db8ff; }
  .point.econ .q { color: #4ade80; }
  .point .a { font-size: 13.5px; line-height: 1.55; color: #ccc; white-space: pre-line; }
  .point .a.hidden { display: none; }
  .point .empty-note { font-style: italic; color: #666; font-size: 12px; }

  /* --- КАРТОЧКИ --- */
  #cardScreen { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 14px; }
  #cardScreen.active { display: flex; }

  .progress-bar { width: 100%; max-width: 400px; height: 5px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#1a56db,#e94560); width: 0%; transition: width .3s; }
  .progress-fill.econ { background: linear-gradient(90deg,#0f9d58,#4ade80); }
  .counter { font-size: 11px; color: #aaa; margin-bottom: 18px; letter-spacing: 0.5px; }

  .card-wrap { width: 100%; max-width: 400px; perspective: 1200px; display: flex; justify-content: center; }
  .card {
    position: relative; background: rgba(26,86,219,0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 22px; padding: 22px 18px; min-height: 400px; width: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.15);
    touch-action: pan-y; user-select: none; cursor: grab;
    transition: transform .25s ease, opacity .25s ease;
  }
  .card.econ { background: rgba(15,157,88,0.88); }
  .card.dragging { transition: none; cursor: grabbing; }

  .card-top { flex: 1; display: flex; flex-direction: column; }
  .card .ruler-tag {
    display: inline-block; background: rgba(255,255,255,0.2); color: #fff; font-size: 11px;
    font-weight: 700; padding: 4px 11px; border-radius: 20px; margin-bottom: 10px;
    align-self: flex-start; backdrop-filter: blur(4px);
  }
  .card .q-points-list { font-size: 15px; line-height: 1.5; color: #e2e8f0; display: flex; flex-direction: column; gap: 8px; }
  .card .q-points-list div { display: flex; gap: 6px; align-items: baseline; }
  .card .q-points-list span.num { font-weight: 700; color: #fff; opacity: 0.7; }

  .card .answer-text {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.2);
    font-size: 13.5px; line-height: 1.55; color: #e2e8f0;
    display: none; max-height: 320px; overflow-y: auto; padding-right: 4px;
  }
  .card .answer-text::-webkit-scrollbar { width: 4px; }
  .card .answer-text::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
  .card .answer-text.show { display: block; }
  .card .answer-text .ans-q { font-weight: 700; color: #4db8ff; margin-top: 12px; margin-bottom: 4px; display: block; }
  .card.econ .answer-text .ans-q { color: #bbf7d0; }
  .card .answer-text .ans-a { color: #d1d9e6; white-space: pre-line; display: block; margin-bottom: 4px; }

  .show-btn {
    margin-top: 18px; padding: 13px 20px; border-radius: 14px; border: none;
    background: #fff; color: #1a56db; font-size: 14px; font-weight: 700;
    cursor: pointer; align-self: flex-start; width: 100%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.1s;
  }
  .card.econ .show-btn { color: #0f9d58; }
  .show-btn:active { transform: scale(0.97); }

  .hint-swipe { margin-top: 16px; font-size: 11px; color: #888; text-align: center; }
  .hint-swipe b { color: #e94560; }

  .done-screen { text-align: center; padding: 28px 22px; background: #111; border-radius: 22px; width: 100%; border: 1px solid rgba(255,255,255,0.1); }
  .done-screen h2 { font-size: 22px; color: #fff; margin-bottom: 10px; }
  .done-screen p { font-size: 15px; color: #aaa; margin-bottom: 5px; }
  .restart-btn {
    margin-top: 20px; padding: 12px 24px; border-radius: 12px; border: none;
    background: #1a56db; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%;
  }
  .restart-btn.econ { background: #0f9d58; }

  @media (max-width: 420px) {
    header { padding: 6px 10px; }
    .tab { padding: 5px 6px; font-size: 11px; }
    .subject-title { font-size: 12px; }
    .menu-btn { width: 32px; height: 32px; }
    .screen { padding: 12px; }
    .card { padding: 18px 16px; min-height: 380px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="subject-title" id="subjectTitle">
      <span class="dot"></span>
      <span id="subjectName">История</span>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="study" onclick="switchTab('study')">Учить</button>
      <button class="tab" data-tab="cards" onclick="switchTab('cards')">Карточки</button>
    </div>
    <button class="menu-btn" onclick="toggleMenu(event)" aria-label="Меню">⋮</button>
  </div>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
<div class="dropdown" id="dropdown">
  <div class="dropdown-label">Выбрать предмет</div>
  <!-- Пункты меню строятся из SUBJECTS автоматически -->
</div>

<div id="studyScreen" class="screen active">
  <div class="ruler-list" id="rulerList"></div>
  <div id="studyContent"></div>
</div>

<div id="cardScreen" class="screen">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="counter" id="counter">0 / 0</div>
  <div class="card-wrap" id="cardWrap"></div>
  <div class="hint-swipe">Свайп <b>влево</b> — не знал · Свайп <b>вправо</b> — знал</div>
</div>

<!-- ============================================================
     ПОДКЛЮЧЕНИЕ ДАННЫХ
     Каждый предмет — отдельный JS-файл, который регистрирует себя
     через registerSubject({...}).
     Чтобы добавить новый предмет — создай newfile.js и подключи ниже.
     ============================================================ -->
<script src="history.js"></script>
<script src="economy.js"></script>

<script>
/* ============================================================
   РЕЕСТР ПРЕДМЕТОВ
   ============================================================ */
const SUBJECTS = []; // { id, name, emoji, color, econ(bool), data }

function registerSubject(cfg) {
  SUBJECTS.push(cfg);
  if (SUBJECTS.length === 1) {
    // первый зарегистрированный — стартовый
    currentSubjectId = cfg.id;
  }
}

/* ============================================================
   ЛОГИКА
   ============================================================ */
let currentSubjectId = null;
let currentMode = 'study';
let currentRulerIdx = 0;
let hideAnswers = false;

function currentSubject() {
  return SUBJECTS.find(s => s.id === currentSubjectId) || SUBJECTS[0];
}
function activeData() {
  return currentSubject().data;
}

/* ---------- МЕНЮ ---------- */
function buildMenu() {
  const dd = document.getElementById('dropdown');
  dd.querySelectorAll('.dropdown-item').forEach(el => el.remove());
  SUBJECTS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'dropdown-item' + (s.id === currentSubjectId ? ' active' : '') + (s.econ ? ' econ' : '');
    btn.dataset.subject = s.id;
    btn.innerHTML = `<span class="emoji">${s.emoji || '📘'}</span> ${s.name} <span class="check">✓</span>`;
    btn.onclick = () => switchSubject(s.id);
    dd.appendChild(btn);
  });
}

function toggleMenu(e) {
  e.stopPropagation();
  const dd = document.getElementById('dropdown');
  const ov = document.getElementById('menuOverlay');
  if (dd.classList.contains('open')) closeMenu();
  else { dd.classList.add('open'); ov.classList.add('open'); }
}
function closeMenu() {
  document.getElementById('dropdown').classList.remove('open');
  document.getElementById('menuOverlay').classList.remove('open');
}
document.addEventListener('click', (e) => {
  const dd = document.getElementById('dropdown');
  if (!dd.classList.contains('open')) return;
  if (e.target.closest('.menu-btn') || e.target.closest('.dropdown')) return;
  closeMenu();
});

/* ---------- ПЕРЕКЛЮЧЕНИЕ ПРЕДМЕТА ---------- */
function switchSubject(id) {
  closeMenu();
  if (currentSubjectId === id) return;
  currentSubjectId = id;
  currentRulerIdx = 0;
  hideAnswers = false;

  buildMenu();
  applySubjectTheme();
  renderRulerList();
  renderStudy();
  if (currentMode === 'cards') startCards();
}

function applySubjectTheme() {
  const s = currentSubject();
  document.getElementById('subjectName').textContent = s.name;
  const titleEl = document.getElementById('subjectTitle');
  titleEl.classList.toggle('econ', !!s.econ);

  const studyTab = document.querySelector('.tab[data-tab="study"]');
  const cardsTab = document.querySelector('.tab[data-tab="cards"]');
  studyTab.classList.toggle('econ', !!s.econ);
  cardsTab.classList.toggle('econ', !!s.econ);
  updateActiveTabColors();
}

function updateActiveTabColors() {
  const isEcon = !!currentSubject().econ;
  document.querySelectorAll('.tab').forEach(t => {
    t.style.background = t.classList.contains('active')
      ? (isEcon ? '#0f9d58' : '#1a56db')
      : 'transparent';
  });
}

function switchTab(name) {
  currentMode = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + name + '"]').classList.add('active');
  updateActiveTabColors();
  document.getElementById('studyScreen').classList.toggle('active', name === 'study');
  document.getElementById('cardScreen').classList.toggle('active', name === 'cards');
  if (name === 'cards') startCards();
}

function renderRulerList() {
  const list = document.getElementById('rulerList');
  list.innerHTML = '';
  const data = activeData();
  const isEcon = !!currentSubject().econ;
  data.forEach((r, i) => {
    const filled = r.points.filter(p => p.a.trim() !== '').length;
    const btn = document.createElement('button');
    btn.className = 'ruler-btn'
      + (i === currentRulerIdx ? ' active' : '')
      + (isEcon ? ' econ' : '')
      + (filled === 0 ? ' empty' : '');
    btn.innerHTML = r.ruler + '<span class="count">' + filled + ' / ' + r.points.length + '</span>';
    btn.onclick = () => { currentRulerIdx = i; renderRulerList(); renderStudy(); };
    list.appendChild(btn);
  });
}

function renderStudy() {
  const r = activeData()[currentRulerIdx];
  const content = document.getElementById('studyContent');
  const isEcon = !!currentSubject().econ;
  let html = '<div class="study-header"><h2>' + r.ruler + '</h2>';
  html += '<button class="hide-btn' + (hideAnswers ? ' on' : '') + '" onclick="toggleHide()">' + (hideAnswers ? 'Показать ответы' : 'Скрыть ответы') + '</button></div>';
  r.points.forEach(p => {
    html += '<div class="point' + (isEcon ? ' econ' : '') + '"><div class="q">' + p.q + '</div>';
    if (p.a.trim() === '') {
      html += '<div class="a"><span class="empty-note">(нет данных — допиши позже)</span></div>';
    } else {
      html += '<div class="a' + (hideAnswers ? ' hidden' : '') + '">' + escapeHtml(p.a) + '</div>';
    }
    html += '</div>';
  });
  content.innerHTML = html;
}

function toggleHide() { hideAnswers = !hideAnswers; renderStudy(); }
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- КАРТОЧКИ ---------- */
let deck = [], totalCards = 0, knownCount = 0, currentCard = null;

function buildFullDeck() {
  const arr = [];
  const isEcon = !!currentSubject().econ;
  activeData().forEach((r) => {
    if (isEcon) {
      r.points.forEach((p) => {
        if (p.a.trim() !== '') arr.push({ ruler: r.ruler, points: [p] });
      });
    } else {
      if (r.points.some(p => p.a.trim() !== '')) arr.push({ ruler: r.ruler, points: r.points });
    }
  });
  return arr;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function startCards() {
  deck = shuffle(buildFullDeck());
  totalCards = deck.length;
  knownCount = 0;
  currentCard = null;
  renderCard();
}

function renderCard() {
  const wrap = document.getElementById('cardWrap');
  const counter = document.getElementById('counter');
  const fill = document.getElementById('progressFill');
  const isEcon = !!currentSubject().econ;

  counter.textContent = (totalCards - deck.length) + ' / ' + totalCards + '   ·   знал: ' + knownCount;
  fill.style.width = (totalCards ? ((totalCards - deck.length) / totalCards * 100) : 0) + '%';
  fill.classList.toggle('econ', isEcon);

  if (deck.length === 0) {
    wrap.innerHTML = '<div class="done-screen"><h2>🎉 Готово!</h2><p>Ты прошёл все карточки.</p><p>Знал: <b>' + knownCount + '</b> из <b>' + totalCards + '</b></p><button class="restart-btn' + (isEcon ? ' econ' : '') + '" onclick="startCards()">Перемешать заново</button></div>';
    return;
  }

  currentCard = deck[0];

  let questionPointsHtml = '';
  currentCard.points.forEach(p => {
    if (isEcon) {
      questionPointsHtml += `<div style="font-size:17px; font-weight:600; line-height:1.4;">${escapeHtml(p.q)}</div>`;
    } else {
      questionPointsHtml += `<div><span class="num">•</span> ${p.q}</div>`;
    }
  });

  let answersHtml = '';
  currentCard.points.forEach(p => {
    if (isEcon) {
      answersHtml += `<div class="ans-a">${escapeHtml(p.a)}</div>`;
    } else {
      answersHtml += `<div class="ans-q">${p.q}</div>`;
      answersHtml += p.a.trim() === ''
        ? `<div class="ans-a"><span class="empty-note">(нет данных)</span></div>`
        : `<div class="ans-a">${escapeHtml(p.a)}</div>`;
    }
  });

  const card = document.createElement('div');
  card.className = 'card' + (isEcon ? ' econ' : '');
  card.innerHTML = `
    <div class="card-top">
      <span class="ruler-tag">${isEcon ? 'Вопрос' : currentCard.ruler}</span>
      <div class="q-points-list" id="qPointsList">${questionPointsHtml}</div>
    </div>
    <div class="answer-text" id="answerText">${answersHtml}</div>
    <button class="show-btn" id="showBtn">Показать ответ</button>
  `;
  wrap.innerHTML = '';
  wrap.appendChild(card);

  document.getElementById('showBtn').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('qPointsList').style.display = 'none';
    document.getElementById('answerText').classList.add('show');
    document.getElementById('showBtn').style.display = 'none';
  };

  attachSwipe(card);
}

function attachSwipe(card) {
  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, locked = null;
  const onStart = (x, y) => { startX = x; startY = y; dx = 0; dy = 0; dragging = true; locked = null; card.classList.add('dragging'); };
  const onMove = (x, y) => {
    if (!dragging) return;
    dx = x - startX; dy = y - startY;
    if (locked === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (locked === 'x') {
      card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 20) + 'deg)';
      card.style.opacity = Math.max(0.4, 1 - Math.abs(dx) / 400);
    }
  };
  const onEnd = () => {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    if (locked === 'x' && Math.abs(dx) > 80) {
      const know = dx > 0;
      card.style.transform = 'translateX(' + (know ? 600 : -600) + 'px) rotate(' + (know ? 30 : -30) + 'deg)';
      card.style.opacity = '0';
      setTimeout(() => {
        const done = deck.shift();
        if (know) knownCount++;
        else deck.push(done);
        renderCard();
      }, 250);
    } else {
      card.style.transform = '';
      card.style.opacity = '';
    }
  };
  card.addEventListener('mousedown', e => { if (e.target.closest('.show-btn')) return; onStart(e.clientX, e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onEnd);
  card.addEventListener('touchstart', e => {
    if (e.target.closest('.show-btn')) return;
    if (e.target.closest('.answer-text') && document.getElementById('answerText').classList.contains('show')) return;
    onStart(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  card.addEventListener('touchmove', e => {
    if (!dragging) return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    if (locked === null) {
      const ddx = x - startX, ddy = y - startY;
      if (Math.abs(ddx) > 8 || Math.abs(ddy) > 8) locked = Math.abs(ddx) > Math.abs(ddy) ? 'x' : 'y';
    }
    if (locked === 'x') e.preventDefault();
    onMove(x, y);
  }, { passive: false });
  card.addEventListener('touchend', onEnd);
}

/* ---------- СТАРТ ---------- */
function boot() {
  if (!SUBJECTS.length) {
    document.getElementById('studyContent').innerHTML =
      '<p style="color:#e94560;padding:20px;">Нет подключённых предметов. Проверь, что history.js и economy.js лежат рядом с index.html.</p>';
    return;
  }
  buildMenu();
  applySubjectTheme();
  renderRulerList();
  renderStudy();
}

// Ждём, пока все <script src> выполнятся, затем строим интерфейс
window.addEventListener('load', boot);
</script>
